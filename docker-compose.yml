services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at build time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_LOCATION_CHECK: ${NEXT_PUBLIC_LOCATION_CHECK:-false}
        NEXT_PUBLIC_CAFE_LAT: ${NEXT_PUBLIC_CAFE_LAT:-}
        NEXT_PUBLIC_CAFE_LNG: ${NEXT_PUBLIC_CAFE_LNG:-}
        NEXT_PUBLIC_CAFE_RADIUS_METERS: ${NEXT_PUBLIC_CAFE_RADIUS_METERS:-200}
    ports:
      - "3100:3000"
    environment:
      # Server-only secrets, read at runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      MAYAR_API_KEY: ${MAYAR_API_KEY}
      MAYAR_IS_PRODUCTION: ${MAYAR_IS_PRODUCTION:-false}
      # Also expose the public ones to the running server (used by route handlers).
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3301/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
